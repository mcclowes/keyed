name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: brew install swiftformat swiftlint shellcheck

      - name: Check build and release helpers
        run: |
          bash -n scripts/test-package.sh scripts/bump-version.sh scripts/test-bump-version.sh scripts/test-run.sh
          shellcheck scripts/test-package.sh scripts/bump-version.sh scripts/test-bump-version.sh scripts/test-run.sh
          make test-package test-bump-helper test-run

      - name: Lint
        run: make lint

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build and test
        run: make test
